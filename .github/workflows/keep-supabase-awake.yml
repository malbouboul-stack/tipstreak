# Le plan gratuit de Supabase met un projet en pause après 7 jours sans activité : l'app ne chargerait
# plus rien. Une lecture quotidienne (publique, en lecture seule) garde le backend de démo éveillé.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # tous les jours à 06:17 UTC
  workflow_dispatch: # lancement manuel possible depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture de la liste des créateurs
        env:
          SUPABASE_URL: https://bkooyqcerfmduzrhhwjm.supabase.co
          # Clé "publishable" : publique par conception, lecture seule (cf. SECURITY.md)
          SUPABASE_KEY: sb_publishable_5oYlQNO070AmtK_327RlcA_xIV54dtc
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/creators?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase a répondu : $status"
          test "$status" = "200"
